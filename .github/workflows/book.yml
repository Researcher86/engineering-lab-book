name: Book checks

permissions:
  contents: read

on:
  push:
    paths:
      - "README.md"
      - "**/*.md"
      - "php-systems-lab/tools/**"
      - ".github/workflows/book.yml"
  pull_request:
    paths:
      - "README.md"
      - "**/*.md"
      - "php-systems-lab/tools/**"
      - ".github/workflows/book.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify lab READMEs
        run: |
          test -f README.md
          for lab in php-systems-lab algorithms-lab architecture-lab architecture-decision-lab system-design-lab; do
            test -f "$lab/README.md"
            grep -Fq "($lab/README.md)" README.md
          done
      - name: Verify code blocks and pinned links
        working-directory: php-systems-lab
        run: python3 tools/check_book.py
      - name: Verify Algorithms Lab chapters
        working-directory: algorithms-lab
        run: python3 ../php-systems-lab/tools/check_book.py --expected-chapters=7
      - name: Verify Architecture Lab chapters
        working-directory: architecture-lab
        run: python3 ../php-systems-lab/tools/check_book.py --expected-chapters=7
      - name: Verify Architecture Decision Lab chapters
        working-directory: architecture-decision-lab
        run: python3 ../php-systems-lab/tools/check_book.py --expected-chapters=7
      - name: Verify System Design Lab chapters
        working-directory: system-design-lab
        run: python3 ../php-systems-lab/tools/check_book.py --expected-chapters=7
